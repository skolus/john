<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>john generator</title>
<style>
  :root{
    --bg: #0a0a0d;
    --bg2: #0d0e12;
    --rain: rgba(180,195,220,0.18);
    --ink: #e7e7ea;
    --ink-dim: #6b6f7a;
    --line: #21222a;
    --accent: #8fa3c0;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
  }

  canvas#rain{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .vignette{
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 0%, rgba(0,0,0,0.55) 100%);
  }

  main{
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 42px;
    padding: 24px;
    text-align: center;
  }

  .eyebrow{
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .stage{
    position: relative;
    width: min(90vw, 420px);
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .result{
    font-size: 64px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink);
    opacity: 0;
    filter: blur(6px);
    transform: translateY(6px);
    transition: opacity .12s ease, filter .12s ease, transform .12s ease;
    user-select: none;
  }

  .result.show{
    opacity: 1;
    filter: blur(0px);
    transform: translateY(0);
    transition: opacity .35s ease, filter .35s ease, transform .35s ease;
  }

  .result.glitching{
    color: var(--accent);
  }

  .placeholder{
    position: absolute;
    color: var(--ink-dim);
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .placeholder.hide{ display: none; }

  button#gen{
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(20,21,26,0.6);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 16px 46px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: border-color .2s ease, background .2s ease, transform .08s ease;
  }

  button#gen:hover{
    border-color: var(--accent);
    background: rgba(30,34,44,0.7);
  }

  button#gen:active{
    transform: scale(0.97);
  }

  button#gen:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .count{
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
    min-height: 14px;
  }

  .count span{ color: var(--ink); }

  footer{
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 2;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--ink-dim);
    opacity: 0.5;
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    .result, .result.show{ transition: none; }
  }
</style>
</head>
<body>

<canvas id="rain"></canvas>
<div class="vignette"></div>

<main>
  <div class="eyebrow">john generator</div>

  <div class="stage">
    <div class="placeholder" id="placeholder">press to generate</div>
    <div class="result" id="result">John</div>
  </div>

  <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
    <button id="gen">generate</button>
    <div class="count" id="count"></div>
  </div>
</main>

<script>
  // ---- rain (matches site's canvas rain treatment) ----
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  let w, h, drops;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.floor((w * h) / 9000);
    drops = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      len: 10 + Math.random() * 18,
      speed: 4 + Math.random() * 6,
      opacity: 0.08 + Math.random() * 0.18
    }));
  }

  function tick(){
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(180,195,220,1)';
    ctx.lineWidth = 1;
    for (const d of drops){
      ctx.globalAlpha = d.opacity;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x, d.y + d.len);
      ctx.stroke();
      d.y += d.speed;
      if (d.y > h){
        d.y = -d.len;
        d.x = Math.random() * w;
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  resize();
  tick();

  // ---- generator ----
  const btn = document.getElementById('gen');
  const result = document.getElementById('result');
  const placeholder = document.getElementById('placeholder');
  const countEl = document.getElementById('count');
  const glitchChars = ['J','0','h','1','n','#','%','J','O','H','N'];

  let total = 0;

  function randomGlitch(target, real, duration, onDone){
    const start = performance.now();
    result.classList.add('show', 'glitching');
    placeholder.classList.add('hide');

    function frame(now){
      const elapsed = now - start;
      if (elapsed < duration){
        let s = '';
        for (let i = 0; i < real.length; i++){
          s += Math.random() < 0.65
            ? glitchChars[Math.floor(Math.random() * glitchChars.length)]
            : real[i];
        }
        target.textContent = s;
        requestAnimationFrame(frame);
      } else {
        target.textContent = real;
        result.classList.remove('glitching');
        onDone && onDone();
      }
    }
    requestAnimationFrame(frame);
  }

  btn.addEventListener('click', () => {
    btn.disabled = true;
    result.classList.remove('show');
    randomGlitch(result, 'John', 260, () => {
      total += 1;
      countEl.innerHTML = `generated <span>${total}</span> time${total === 1 ? '' : 's'}`;
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
